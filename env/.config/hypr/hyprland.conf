# =====================
# Variables
# =====================
$mod = SUPER
$terminal = ghostty
$browser = zen-browser
$menu = wofi --show drun

# =====================
# Startup
# =====================
exec-once = waybar
exec-once = hypridle
exec-once = hyprpaper

# =====================
# Input
# =====================
input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        middle_button_emulation = true
    }
}

# =====================
# General
# =====================
monitor=,preferred,auto,1.2

general {
    gaps_in = 7
    gaps_out = 7
    border_size = 2
    layout = dwindle

    col.active_border = rgb(77dd77)
    col.inactive_border = rgb(2e3440)
}

decoration {
    rounding = 5
    inactive_opacity = 0.9
    active_opacity = 1.0

    blur {
        enabled = false
    }
}

animations {
    enabled = true

    animation = windows, 1, 2, default
    animation = windowsOut, 1, 2, default
    animation = fade, 1, 1, default
    animation = workspaces, 1, 2, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    vfr = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# =====================
# Apps / system
# =====================
bind = $mod, RETURN, exec, $terminal
bind = $mod, APOSTROPHE, exec, $browser
bind = $mod, D, exec, $menu

bind = $mod, Q, killactive
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exec, wlogout
bind = $mod SHIFT, PERIOD, exec, hyprlock

# =====================
# Screenshot: region/full → save + clipboard
# =====================
bind = , PRINT, exec, sh -c 'mkdir -p ~/Pictures && grim -g "$(slurp)" - | tee ~/Pictures/screenshot_$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy'
bind = SHIFT, PRINT, exec, sh -c 'mkdir -p ~/Pictures && grim - | tee ~/Pictures/screenshot_$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy'

# =====================
# Media / brightness
# =====================
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%

bind = , XF86AudioPlay, exec, playerctl play
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bind = , XF86MonBrightnessUp, exec, brightnessctl -q set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%-

# =====================
# Focus / move
# =====================
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# =====================
# Workspaces
# =====================
bind = $mod, TAB, workspace, e+1
bind = $mod, GRAVE, workspace, e-1

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# =====================
# Layout controls
# =====================
bind = $mod, F, fullscreen
bind = $mod SHIFT, SPACE, togglefloating
bind = $mod, SPACE, cyclenext

# scratchpad equivalent
bind = $mod SHIFT, MINUS, movetoworkspace, special
bind = $mod, MINUS, togglespecialworkspace

# =====================
# Resize mode
# =====================
bind = $mod, R, submap, resize

submap = resize
bind = , H, resizeactive, -10 0
bind = , J, resizeactive, 0 10
bind = , K, resizeactive, 0 -10
bind = , L, resizeactive, 10 0
bind = , LEFT, resizeactive, -10 0
bind = , DOWN, resizeactive, 0 10
bind = , UP, resizeactive, 0 -10
bind = , RIGHT, resizeactive, 10 0
bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
submap = reset
